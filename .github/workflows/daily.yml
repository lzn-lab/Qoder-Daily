name: Qoder Daily

on:
  # GitHub 对 fork 仓库的 schedule 常延迟数小时，多条兜底；
  # 任一条命中即可，签到幂等，重复运行不会重复加分。cron 用 UTC（北京 = UTC+8）。
  schedule:
    - cron: "20 2 * * *"    # 北京 10:20
    - cron: "20 4 * * *"    # 北京 12:20
    - cron: "20 7 * * *"    # 北京 15:20
    - cron: "20 10 * * *"   # 北京 18:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: Qoder-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      QODER_CACHE_KEY: ${{ secrets.QODER_CACHE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Warn missing cache encryption key
        if: ${{ env.QODER_CACHE_KEY == '' }}
        run: |
          echo "::warning::未设置 QODER_CACHE_KEY，本次将跳过 token 状态持久化；轮换后的 refresh_token 可能无法在下次运行恢复。"

      - name: Restore encrypted token state
        if: ${{ env.QODER_CACHE_KEY != '' }}
        uses: actions/cache/restore@v4
        with:
          path: .qoder-cache/state.enc
          key: qoder-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qoder-state-v2-

      - name: Decrypt token state
        if: ${{ env.QODER_CACHE_KEY != '' && hashFiles('.qoder-cache/state.enc') != '' }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:QODER_CACHE_KEY -in .qoder-cache/state.enc -out "$RUNNER_TEMP/qoder-state.tar"
          tar -xf "$RUNNER_TEMP/qoder-state.tar" -C .
          rm -f "$RUNNER_TEMP/qoder-state.tar"

      - name: Run Qoder Daily
        id: qoder
        env:
          QODER_TOKENS: ${{ secrets.QODER_TOKENS }}
          QODER_GLOBAL_TOKENS: ${{ secrets.QODER_GLOBAL_TOKENS }}
          QODER_MACHINE_TOKEN: ${{ secrets.QODER_MACHINE_TOKEN }}
          QODER_MACHINE_CODE: ${{ secrets.QODER_MACHINE_CODE }}
          QODER_MACHINE_TYPE: ${{ secrets.QODER_MACHINE_TYPE }}
          QODERCN_RUNTIME_INFO: ${{ secrets.QODERCN_RUNTIME_INFO }}
          QODER_RUNTIME_INFO: ${{ secrets.QODER_RUNTIME_INFO }}
          QODER_UMID_PATH: ${{ secrets.QODER_UMID_PATH }}
          QODER_UMID_NO_INSTALL: ${{ secrets.QODER_UMID_NO_INSTALL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          QODER_WINDOW_RETRY: "1"
          QODER_WINDOW_RETRY_MAX: "16"
          QODER_WINDOW_RETRY_GAP: "90"
        run: python qoder_daily.py

      # Refresh may succeed before a later request fails; retain rotated tokens.
      - name: Write Qoder status
        if: ${{ always() }}
        env:
          QODER_OUTCOME: ${{ steps.qoder.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p status
          python3 -c "
          import json, datetime, os
          d = {
            'runId': int(os.environ['RUN_ID']),
            'outcome': os.environ['QODER_OUTCOME'],
            'event': os.environ['RUN_EVENT'],
            'htmlUrl': 'https://github.com/' + os.environ['REPO'] + '/actions/runs/' + os.environ['RUN_ID'],
            'finishedAt': datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat(timespec='seconds')
          }
          json.dump(d, open('status/qoder.json', 'w'), ensure_ascii=False, indent=2)
          "
          echo "Qoder 状态文件已生成"

      - name: Encrypt token state
        if: ${{ always() && env.QODER_CACHE_KEY != '' }}
        run: |
          mkdir -p .qoder-cache
          files=""
          for f in qoder_tokens.json qoder_machine_id; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          if [ -n "$files" ]; then
            tar -cf "$RUNNER_TEMP/qoder-state.tar" $files
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:QODER_CACHE_KEY -in "$RUNNER_TEMP/qoder-state.tar" -out .qoder-cache/state.enc
            rm -f "$RUNNER_TEMP/qoder-state.tar"
          fi

      - name: Save encrypted token state
        if: ${{ always() && env.QODER_CACHE_KEY != '' && hashFiles('.qoder-cache/state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .qoder-cache/state.enc
          key: qoder-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit Qoder status
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ ! -f status/qoder.json ]; then
            echo "没有 Qoder 状态文件，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f status/qoder.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync qoder status"
          for i in 1 2 3; do
            if git push; then
              echo "状态已推送"
              exit 0
            fi
            echo "push 冲突，rebase 后重试 ($i/3)"
            git fetch origin main || break
            git rebase origin/main || { git rebase --abort; break; }
          done
          echo "::warning::状态文件推送失败，不影响签到结果"
